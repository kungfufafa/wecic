<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Ada Koneksi — myCIC</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            color-scheme: light dark;
            --surface: #08090a;
            --surface-elevated: #0f1011;
            --surface-muted: #191a1b;
            --ink: #f7f8f8;
            --ink-soft: #8a8f98;
            --line: rgba(255, 255, 255, 0.08);
            --accent: #0352a1;
            --accent-strong: #2679db;
            --success: #16a34a;
            --warning: #d97706;
            --card-top: rgba(25, 26, 27, 0.9);
            --card-bottom: rgba(15, 16, 17, 0.96);
            --page-top: #091019;
            --grid-line: rgba(255, 255, 255, 0.03);
            --status-ink: #e7c66b;
        }

        /* Follow the device theme, like the app itself does. */
        @media (prefers-color-scheme: light) {
            :root {
                --surface: #f4f6fa;
                --surface-elevated: #ffffff;
                --surface-muted: #e9edf3;
                --ink: #0f172a;
                --ink-soft: #526077;
                --line: rgba(15, 23, 42, 0.1);
                --card-top: rgba(255, 255, 255, 0.96);
                --card-bottom: rgba(248, 250, 252, 0.98);
                --page-top: #e8f0fb;
                --grid-line: rgba(15, 23, 42, 0.04);
                --status-ink: #92400e;
            }
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at top center, rgba(38, 121, 219, 0.18), transparent 22rem),
                radial-gradient(circle at 10% 0%, rgba(3, 82, 161, 0.16), transparent 20rem),
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
                linear-gradient(180deg, var(--page-top), var(--surface));
            background-size: 32px 32px, 32px 32px, auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            color: var(--ink);
            font-feature-settings: 'cv01', 'ss03';
        }

        .card {
            background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            padding: 2.5rem 2rem;
            max-width: 22rem;
            width: 100%;
            text-align: center;
        }

        .status-strip {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.8rem;
            border: 1px solid rgba(212, 167, 44, 0.24);
            border-radius: 0.375rem;
            background: rgba(212, 167, 44, 0.08);
            font-size: 0.78rem;
            font-weight: 510;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--status-ink);
            margin: 0 auto 1.4rem;
        }

        .status-strip.is-online {
            border-color: rgba(16, 185, 129, 0.24);
            background: rgba(16, 185, 129, 0.08);
            color: var(--success);
        }

        .status-dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 999px;
            background: var(--warning);
        }

        .status-strip.is-online .status-dot {
            background: var(--success);
        }

        .icon {
            width: 3.5rem;
            height: 3.5rem;
            background: rgba(3, 82, 161, 0.12);
            border: 1px solid rgba(3, 82, 161, 0.18);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon svg {
            width: 1.75rem;
            height: 1.75rem;
            color: var(--accent);
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 590;
            letter-spacing: -0.04em;
            margin-bottom: 1.25rem;
        }

        .brand-my { color: var(--ink-soft); }
        .brand-cic { color: var(--accent-strong); }

        h1 {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            font-size: 1.5rem;
            font-weight: 510;
            letter-spacing: -0.04em;
            color: var(--ink);
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 0.875rem;
            line-height: 1.75;
            color: var(--ink-soft);
            margin-bottom: 2rem;
        }

        .meta {
            font-size: 0.8125rem;
            line-height: 1.7;
            margin-top: -1rem;
            margin-bottom: 1.4rem;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 510;
            color: white;
            background: linear-gradient(180deg, var(--accent), var(--accent-strong));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 180ms ease, opacity 180ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div id="offline-status" class="status-strip" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="offline-status-label">Offline</span>
        </div>
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0-3.75-3.75M17.25 21 21 17.25" />
            </svg>
        </div>
        <div class="brand"><span class="brand-my">my</span><span class="brand-cic">CIC</span></div>
        <h1 id="offline-title">Tidak ada koneksi</h1>
        <p id="offline-copy">Pastikan perangkat kamu terhubung ke internet, lalu coba lagi.</p>
        <p class="meta" id="offline-meta">Begitu koneksi kembali, aplikasi akan memuat ulang dan mengambil data terbaru.</p>
        <button type="button" id="retry-button">Coba lagi</button>
    </div>
    <script>
        const statusStrip = document.getElementById('offline-status');
        const statusLabel = document.getElementById('offline-status-label');
        const offlineTitle = document.getElementById('offline-title');
        const offlineCopy = document.getElementById('offline-copy');
        const offlineMeta = document.getElementById('offline-meta');
        const retryButton = document.getElementById('retry-button');
        // Laravel's health route: never cached by the service worker, open
        // during maintenance, and it touches no session.
        const probeUrl = '/up';
        const probeTimeoutMs = 8000;
        const firstRetryMs = 2000;
        const maxRetryMs = 60000;
        // The attempt count outlives the reload it leads to (the app removes
        // it once a page loads), so a server that answers the probe but
        // still fails the page cannot start a fast reload loop.
        const attemptStorageKey = 'mycic-offline-retry';
        let attempt = restoreAttempt();
        let retryTimer = null;
        let probeController = null;
        let generation = 0;

        function restoreAttempt() {
            try {
                const stored = JSON.parse(window.sessionStorage.getItem(attemptStorageKey) || 'null');
                const age = Date.now() - Number(stored?.at);

                if (Number.isInteger(stored?.attempt) && stored.attempt > 0 && age >= 0 && age < maxRetryMs * 2) {
                    return stored.attempt;
                }
            } catch (error) {
                // Storage blocked: the retries start again from the shortest wait.
            }

            return 0;
        }

        function rememberAttempt() {
            try {
                window.sessionStorage.setItem(attemptStorageKey, JSON.stringify({ attempt, at: Date.now() }));
            } catch (error) {
                // Storage blocked: the next copy of this page starts from the shortest wait.
            }
        }

        function retryDelay(count) {
            return Math.min(firstRetryMs * (2 ** count), maxRetryMs);
        }

        function stopRetrying() {
            generation += 1;
            window.clearTimeout(retryTimer);
            retryTimer = null;
            probeController?.abort();
            probeController = null;
        }

        function reloadPage() {
            stopRetrying();
            rememberAttempt();
            window.location.reload();
        }

        function render({ online, label, title, copy, meta, button, busy }) {
            statusStrip.classList.toggle('is-online', online);
            statusLabel.textContent = label;
            offlineTitle.textContent = title;
            offlineCopy.textContent = copy;
            offlineMeta.textContent = meta;
            retryButton.textContent = button;
            retryButton.disabled = busy;
        }

        function showDeviceOffline() {
            stopRetrying();
            render({
                online: false,
                label: 'Offline',
                title: 'Tidak ada koneksi',
                copy: 'Pastikan perangkat kamu terhubung ke internet, lalu coba lagi.',
                meta: 'Begitu koneksi kembali, aplikasi akan memuat ulang dan mengambil data terbaru.',
                button: 'Coba lagi',
                busy: false,
            });
        }

        function showReconnected() {
            stopRetrying();
            render({
                online: true,
                label: 'Online lagi',
                title: 'Koneksi kembali',
                copy: 'Koneksi sudah kembali. myCIC sedang memuat ulang halaman.',
                meta: 'Tunggu sebentar, data terbaru akan diambil dari server.',
                button: 'Memuat ulang...',
                busy: true,
            });
            retryTimer = window.setTimeout(reloadPage, 600);
        }

        // The device reports a connection, yet the page could not load: the
        // signal is weak or the server is down. The page reloads only once a
        // probe gets an answer, waiting longer after each miss.
        function showServerUnreachable() {
            stopRetrying();
            render({
                online: false,
                label: 'Mencoba menyambung lagi…',
                title: 'myCIC belum bisa dihubungi',
                copy: 'Perangkat terhubung ke internet, tetapi server myCIC belum menjawab.',
                meta: '',
                button: 'Coba lagi',
                busy: false,
            });
            scheduleProbe();
        }

        function scheduleProbe() {
            const delay = retryDelay(attempt);

            attempt += 1;
            offlineMeta.textContent = `Dicoba lagi otomatis dalam ${Math.round(delay / 1000)} detik.`;
            retryTimer = window.setTimeout(probeServer, delay);
        }

        async function probeServer() {
            retryTimer = null;

            if (!navigator.onLine) {
                showDeviceOffline();

                return;
            }

            const current = generation;
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const timeout = window.setTimeout(() => controller?.abort(), probeTimeoutMs);
            let answered = false;

            probeController = controller;
            offlineMeta.textContent = 'Memeriksa server myCIC…';

            try {
                const response = await fetch(probeUrl, {
                    cache: 'no-store',
                    credentials: 'same-origin',
                    signal: controller?.signal,
                });

                answered = response.ok;
            } catch (error) {
                answered = false;
            } finally {
                window.clearTimeout(timeout);
            }

            // Gone offline, or reloading, while the probe was out.
            if (current !== generation) {
                return;
            }

            probeController = null;

            if (answered) {
                offlineMeta.textContent = 'Server menjawab lagi. Memuat ulang halaman…';
                reloadPage();

                return;
            }

            scheduleProbe();
        }

        retryButton.addEventListener('click', reloadPage);
        window.addEventListener('online', showReconnected);
        window.addEventListener('offline', showDeviceOffline);

        if (navigator.onLine) {
            showServerUnreachable();
        } else {
            showDeviceOffline();
        }
    </script>
</body>
</html>
