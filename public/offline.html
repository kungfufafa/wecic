<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Ada Koneksi — WeCIC</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            color-scheme: light dark;
            --surface: #111113;
            --surface-elevated: #18181b;
            --surface-muted: #222226;
            --ink: #ededee;
            --ink-soft: #a1a1a8;
            --ink-subtle: #82828a;
            --line: #28282c;
            --accent: #2a6fd1;
            --accent-hover: #387ee0;
            --accent-pressed: #1f5fb9;
            --success: #4cc38a;
            --success-bg: rgba(76, 195, 138, 0.14);
            --success-border: rgba(76, 195, 138, 0.28);
            --warning: #f0b429;
            --status-bg: rgba(240, 180, 41, 0.12);
            --status-border: rgba(240, 180, 41, 0.28);
            --status-ink: #f0b429;
            --card-shadow: none;
        }

        /* Follow the device theme, like the app itself does. */
        @media (prefers-color-scheme: light) {
            :root {
                --surface: #fafafa;
                --surface-elevated: #ffffff;
                --surface-muted: #f4f4f5;
                --ink: #171717;
                --ink-soft: #525252;
                --ink-subtle: #6e6e73;
                --line: #e4e4e7;
                --accent: #0352a1;
                --accent-hover: #024182;
                --accent-pressed: #02366c;
                --success: #15803d;
                --success-bg: #ecfdf3;
                --success-border: rgba(21, 128, 61, 0.2);
                --warning: #b45309;
                --status-bg: #fef6e7;
                --status-border: rgba(180, 83, 9, 0.2);
                --status-ink: #b45309;
                --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            }
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background: var(--surface);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--ink);
            font-feature-settings: 'cv01', 'ss03';
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--surface-elevated);
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 24rem;
            width: 100%;
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .status-strip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.625rem;
            border: 1px solid var(--status-border);
            border-radius: 0.375rem;
            background: var(--status-bg);
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1.25;
            color: var(--status-ink);
            margin: 0 auto 1.5rem;
        }

        .status-strip.is-online {
            border-color: var(--success-border);
            background: var(--success-bg);
            color: var(--success);
        }

        .status-dot {
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 999px;
            background: var(--warning);
        }

        .status-strip.is-online .status-dot {
            background: var(--success);
        }

        .icon {
            width: 3rem;
            height: 3rem;
            background: var(--surface-muted);
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon svg {
            width: 1.5rem;
            height: 1.5rem;
            color: var(--ink-soft);
        }

        .brand {
            display: flex;
            justify-content: center;
            color: var(--ink);
            margin-bottom: 1rem;
        }

        .brand svg {
            width: 8.5rem;
            height: auto;
        }

        h1 {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            font-size: 1.375rem;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.025em;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.875rem;
            line-height: 1.625;
            color: var(--ink-soft);
            margin-bottom: 1.5rem;
        }

        .meta {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            color: var(--ink-subtle);
            margin-top: -0.75rem;
            margin-bottom: 1.5rem;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 2.75rem;
            padding: 0 1rem;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
            user-select: none;
            color: #ffffff;
            background: var(--accent);
            border: 1px solid transparent;
            border-radius: 0.5rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
            cursor: pointer;
            transition: color 150ms cubic-bezier(0.22, 1, 0.36, 1), background-color 150ms cubic-bezier(0.22, 1, 0.36, 1), border-color 150ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 150ms cubic-bezier(0.22, 1, 0.36, 1), transform 150ms cubic-bezier(0.22, 1, 0.36, 1), opacity 150ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
            background: var(--accent-pressed);
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.5;
            pointer-events: none;
            cursor: default;
        }
    </style>
    <link rel="preconnect" href="https://fonts.bunny.net">

</head>
<body>
    <div class="card">
        <div id="offline-status" class="status-strip" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="offline-status-label">Offline</span>
        </div>
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            </svg>
        </div>
        <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" role="img" aria-label="WeCIC" width="176" height="52"><g id="symbol">

</g></svg></div>
        <h1 id="offline-title">Tidak ada koneksi</h1>
        <p id="offline-copy">Pastikan perangkat kamu terhubung ke internet, lalu coba lagi.</p>
        <p class="meta" id="offline-meta">Begitu koneksi kembali, aplikasi akan memuat ulang dan mengambil data terbaru.</p>
        <button type="button" id="retry-button">Coba lagi</button>
    </div>
    <script>
        const statusStrip = document.getElementById('offline-status');
        const statusLabel = document.getElementById('offline-status-label');
        const offlineTitle = document.getElementById('offline-title');
        const offlineCopy = document.getElementById('offline-copy');
        const offlineMeta = document.getElementById('offline-meta');
        const retryButton = document.getElementById('retry-button');
        // Laravel's health route: never cached by the service worker, open
        // during maintenance, and it touches no session.
        const probeUrl = '/up';
        const probeTimeoutMs = 8000;
        const firstRetryMs = 2000;
        const maxRetryMs = 60000;
        // The attempt count outlives the reload it leads to (the app removes
        // it once a page loads), so a server that answers the probe but
        // still fails the page cannot start a fast reload loop.
        const attemptStorageKey = 'mycic-offline-retry';
        let attempt = restoreAttempt();
        let retryTimer = null;
        let probeController = null;
        let generation = 0;

        function restoreAttempt() {
            try {
                const stored = JSON.parse(window.sessionStorage.getItem(attemptStorageKey) || 'null');
                const age = Date.now() - Number(stored?.at);

                if (Number.isInteger(stored?.attempt) && stored.attempt > 0 && age >= 0 && age < maxRetryMs * 2) {
                    return stored.attempt;
                }
            } catch (error) {
                // Storage blocked: the retries start again from the shortest wait.
            }

            return 0;
        }

        function rememberAttempt() {
            try {
                window.sessionStorage.setItem(attemptStorageKey, JSON.stringify({ attempt, at: Date.now() }));
            } catch (error) {
                // Storage blocked: the next copy of this page starts from the shortest wait.
            }
        }

        function retryDelay(count) {
            return Math.min(firstRetryMs * (2 ** count), maxRetryMs);
        }

        function stopRetrying() {
            generation += 1;
            window.clearTimeout(retryTimer);
            retryTimer = null;
            probeController?.abort();
            probeController = null;
        }

        function reloadPage() {
            stopRetrying();
            rememberAttempt();
            window.location.reload();
        }

        function render({ online, label, title, copy, meta, button, busy }) {
            statusStrip.classList.toggle('is-online', online);
            statusLabel.textContent = label;
            offlineTitle.textContent = title;
            offlineCopy.textContent = copy;
            offlineMeta.textContent = meta;
            retryButton.textContent = button;
            retryButton.disabled = busy;
        }

        function showDeviceOffline() {
            stopRetrying();
            render({
                online: false,
                label: 'Offline',
                title: 'Tidak ada koneksi',
                copy: 'Pastikan perangkat kamu terhubung ke internet, lalu coba lagi.',
                meta: 'Begitu koneksi kembali, aplikasi akan memuat ulang dan mengambil data terbaru.',
                button: 'Coba lagi',
                busy: false,
            });
        }

        function showReconnected() {
            stopRetrying();
            render({
                online: true,
                label: 'Online lagi',
                title: 'Koneksi kembali',
                copy: 'Koneksi sudah kembali. WeCIC sedang memuat ulang halaman.',
                meta: 'Tunggu sebentar, data terbaru akan diambil dari server.',
                button: 'Memuat ulang...',
                busy: true,
            });
            retryTimer = window.setTimeout(reloadPage, 600);
        }

        // The device reports a connection, yet the page could not load: the
        // signal is weak or the server is down. The page reloads only once a
        // probe gets an answer, waiting longer after each miss.
        function showServerUnreachable() {
            stopRetrying();
            render({
                online: false,
                label: 'Mencoba menyambung lagi…',
                title: 'WeCIC belum bisa dihubungi',
                copy: 'Perangkat terhubung ke internet, tetapi server WeCIC belum menjawab.',
                meta: '',
                button: 'Coba lagi',
                busy: false,
            });
            scheduleProbe();
        }

        function scheduleProbe() {
            const delay = retryDelay(attempt);

            attempt += 1;
            offlineMeta.textContent = `Dicoba lagi otomatis dalam ${Math.round(delay / 1000)} detik.`;
            retryTimer = window.setTimeout(probeServer, delay);
        }

        async function probeServer() {
            retryTimer = null;

            if (!navigator.onLine) {
                showDeviceOffline();

                return;
            }

            const current = generation;
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const timeout = window.setTimeout(() => controller?.abort(), probeTimeoutMs);
            let answered = false;

            probeController = controller;
            offlineMeta.textContent = 'Memeriksa server WeCIC…';

            try {
                const response = await fetch(probeUrl, {
                    cache: 'no-store',
                    credentials: 'same-origin',
                    signal: controller?.signal,
                });

                answered = response.ok;
            } catch (error) {
                answered = false;
            } finally {
                window.clearTimeout(timeout);
            }

            // Gone offline, or reloading, while the probe was out.
            if (current !== generation) {
                return;
            }

            probeController = null;

            if (answered) {
                offlineMeta.textContent = 'Server menjawab lagi. Memuat ulang halaman…';
                reloadPage();

                return;
            }

            scheduleProbe();
        }

        retryButton.addEventListener('click', reloadPage);
        window.addEventListener('online', showReconnected);
        window.addEventListener('offline', showDeviceOffline);

        if (navigator.onLine) {
            showServerUnreachable();
        } else {
            showDeviceOffline();
        }
    </script>
</body>
</html>
