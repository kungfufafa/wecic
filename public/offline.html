<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Ada Koneksi — myCIC</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --surface: #f6f6fa;
            --ink: #2a2a3a;
            --ink-soft: #6b6b80;
            --line: #dddde8;
            --accent: #3d5fa0;
            --success: #2f8a56;
            --warning: #c9922a;
        }

        body {
            font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
            background:
                linear-gradient(to right, rgba(221,221,232,0.45) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(221,221,232,0.45) 1px, transparent 1px),
                linear-gradient(to bottom, #f9f9fc, var(--surface));
            background-size: 32px 32px, 32px 32px, auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            color: var(--ink);
        }

        .card {
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--line);
            border-radius: 1.5rem;
            box-shadow: 0 10px 24px rgba(42,42,58,0.06);
            padding: 2.5rem 2rem;
            max-width: 22rem;
            width: 100%;
            text-align: center;
        }

        .status-strip {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.9rem;
            border: 1px solid rgba(201,146,42,0.22);
            border-radius: 999px;
            background: rgba(255,250,240,0.92);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #8d6319;
            margin: 0 auto 1.4rem;
        }

        .status-strip.is-online {
            border-color: rgba(47,138,86,0.22);
            background: rgba(240,251,244,0.94);
            color: var(--success);
        }

        .status-dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 999px;
            background: var(--warning);
            box-shadow: 0 0 0 6px rgba(201,146,42,0.12);
        }

        .status-strip.is-online .status-dot {
            background: var(--success);
            box-shadow: 0 0 0 6px rgba(47,138,86,0.12);
        }

        .icon {
            width: 3.5rem;
            height: 3.5rem;
            background: rgba(61,95,160,0.08);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon svg {
            width: 1.75rem;
            height: 1.75rem;
            color: var(--accent);
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
        }

        .brand-my { color: #c9922a; }
        .brand-cic { color: var(--accent); }

        h1 {
            font-family: 'Chivo', ui-sans-serif, system-ui, sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--ink);
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 0.875rem;
            line-height: 1.75;
            color: var(--ink-soft);
            margin-bottom: 2rem;
        }

        .meta {
            font-size: 0.8125rem;
            line-height: 1.7;
            margin-top: -1rem;
            margin-bottom: 1.4rem;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(180deg, #4a70b8, #3d5fa0);
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(61,95,160,0.24);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(61,95,160,0.32);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div id="offline-status" class="status-strip">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="offline-status-label">Offline</span>
        </div>
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0-3.75-3.75M17.25 21 21 17.25" />
            </svg>
        </div>
        <div class="brand"><span class="brand-my">my</span><span class="brand-cic">CIC</span></div>
        <h1>Tidak ada koneksi</h1>
        <p id="offline-copy">Pastikan perangkat kamu terhubung ke internet, lalu coba lagi.</p>
        <p class="meta" id="offline-meta">Begitu koneksi kembali, aplikasi akan memuat ulang dan mengambil data terbaru.</p>
        <button id="retry-button" onclick="window.location.reload()">Coba lagi</button>
    </div>
    <script>
        const statusStrip = document.getElementById('offline-status');
        const statusLabel = document.getElementById('offline-status-label');
        const offlineCopy = document.getElementById('offline-copy');
        const offlineMeta = document.getElementById('offline-meta');
        const retryButton = document.getElementById('retry-button');

        function reflectConnectionState() {
            const isOnline = navigator.onLine;

            statusStrip.classList.toggle('is-online', isOnline);
            statusLabel.textContent = isOnline ? 'Online lagi' : 'Offline';
            offlineCopy.textContent = isOnline
                ? 'Koneksi sudah kembali. myCIC sedang memuat ulang halaman.'
                : 'Pastikan perangkat kamu terhubung ke internet, lalu coba lagi.';
            offlineMeta.textContent = isOnline
                ? 'Tunggu sebentar, data terbaru akan diambil dari server.'
                : 'Begitu koneksi kembali, aplikasi akan memuat ulang dan mengambil data terbaru.';
            retryButton.textContent = isOnline ? 'Memuat ulang...' : 'Coba lagi';
            retryButton.disabled = isOnline;

            if (isOnline) {
                window.setTimeout(() => {
                    window.location.reload();
                }, 600);
            }
        }

        window.addEventListener('online', reflectConnectionState);
        window.addEventListener('offline', reflectConnectionState);

        reflectConnectionState();
    </script>
</body>
</html>
